# ~/.config/kitty/open-actions.conf   (on the machine running kitty)
#
# kitty consults this file when a URL is clicked. It is kitty's own click
# pipeline and runs no matter which app owns the pane, because kitty scans the
# displayed text itself. Herdr grabs the mouse, so the click that reaches kitty
# is ctrl+shift+left (see kitty.conf.snippet).
#
# __CFG__ is replaced by your kitty config dir at install time (see README).

# Images -> Herdr overlay viewer on the remote box (zoom/pan).
protocol file
ext png,jpg,jpeg,webp,gif,bmp,tif,tiff
action launch --type=background __CFG__/img-remote.sh ${FILE_PATH}

# Video -> stream over ssh into mpv drawing with the kitty graphics protocol,
# in a kitty overlay window. Needs `brew install mpv`. UNTESTED.
protocol file
ext mp4,mkv,webm,mov,avi,m4v
action launch --type=overlay sh -c "ssh -o BatchMode=yes __HOST__ cat '${FILE_PATH}' | mpv --vo=kitty --really-quiet -"
