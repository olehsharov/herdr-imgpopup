# ~/.config/kitty/open-actions.conf   (on the machine running kitty)
#
# kitty consults this file when a URL is CLICKED - it is kitty's own click
# pipeline and runs no matter which app (Herdr, Claude Code, ranger) owns the
# pane, because kitty scans the displayed text itself. Herdr grabs the mouse,
# so the click that reaches kitty is ctrl+shift+left (see kitty.conf).
#
# Replace `renderilla` with the ssh target you pass to `herdr --remote`.

# Images -> open in the Herdr overlay viewer on the remote box (zoom/pan).
protocol file
ext png,jpg,jpeg,webp,gif,bmp,tif,tiff
action launch --type=background ssh renderilla img '${FILE_PATH}'

# Alternative for images that never touches Herdr's graphics path: stream the
# bytes over ssh and let kitty's own icat draw them in a kitty overlay window.
# No zoom, but works even if Herdr's kitty_graphics is off. Uncomment to prefer.
#protocol file
#ext png,jpg,jpeg,webp,gif,bmp,tif,tiff
#action launch --type=overlay sh -c "ssh renderilla cat '${FILE_PATH}' | kitten icat --hold --stdin=yes"

# Video -> stream over ssh into mpv drawing with the kitty graphics protocol,
# in a kitty overlay window. Needs `brew install mpv` on the Mac. UNTESTED here.
protocol file
ext mp4,mkv,webm,mov,avi,m4v
action launch --type=overlay sh -c "ssh renderilla cat '${FILE_PATH}' | mpv --vo=kitty --really-quiet -"
